# Controller show triggers. Button names come from the active controller YAML.
# Sound actions default to the head Orin. Use the mapping form with
# target: body when a sound should play from the body speakers.
defaults:
  event: press
  cooldown_s: 0.10
  target: head

# Actions may be compact strings:
#   "play quack.wav"
#   "play_from quacks"
#   "quack /antenna/idle"
#   "pdplay pose"
#   "pdrelax"
# or one-key mappings:
#   - play: {file: quack.wav, target: body}
#   - play_from: {dir: curious, target: head, recursive: true}
#   - quack: /torch/on 0.25 6000
#   - pdplay: stand
#   - pdrelax: true
triggers:
  neutral:
    - "quack /antenna/idle"

  shake:
    - "play_from duck"
    - "quack /antenna/excited"

  wiggle:
    - "play_from happy"
    - "quack /antenna/happy"

  roll:
    - "quack /antenna/scan"

  nod:
    - "quack /antenna/yes"

  march:
    - "play march.wav"
    - "quack /antenna/curious"

  random:
    - "play_from bd"

  /antenna/excited:
    - "play_from excited"
    - "quack /antenna/excited"

  /antenna/scared:
    - "quack /antenna/scared"
    - "play_from scared"

  /antenna/curious:
    - "play_from curious"
    - "quack /antenna/curious"

  lamp:
    - "quack /antenna/curious"
    - "quack /torch/on 0.25 6000"

  center:
    - "quack /antenna/center"

  jump:
    - "play jump.wav"
    - "quack /antenna/happy"

  pose:
    - "pdplay pose"
    - "quack /antenna/curious"

  stand:
    - "pdplay stand"
    - "quack /antenna/idle"

  relax:
    - "pdrelax"
    - "quack /antenna/retract"

  A:
    - "play quack.wav"

  LB:
    - "play_from quacks"
