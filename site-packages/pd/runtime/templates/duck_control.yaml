# duck_control.yaml
#
# Optional configuration for DuckDrive + DuckSense.
# If you do not pass this file, defaults are used.

duckdrive:
  # Input shaping
  deadzone: 0.015
  response_exponent: 0.5

  # Time-based smoothing for command outputs (independent of polling rate)
  cmd_tau_s: 0.03
  cmd_eps: 1.0e-3

  # Head trailing (how "heavy" the head feels)
  head_trail_tau_s: 0.20

  # Trunk command output smoothing. These are applied after torso assist,
  # forward-trunk boost, idle wiggles, and walking suppression target selection.
  # Larger = smoother/slower. 0 = snap. Set per-axis values to null to inherit trunk_tau_s.
  trunk_tau_s: 0.42
  trunk_pitch_tau_s: 0.26
  trunk_yaw_tau_s: 0.22
  trunk_roll_tau_s: 0.22

  # Torso assist (kicks in near head extremes)
  torso_onset: 0.60
  torso_gain_pitch: 1.00
  torso_gain_yaw: 1.00
  torso_gain_roll: 1.00

  # Pitch inversion blend around this threshold (unit space)
  pitch_invert_thresh: -0.2
  pitch_invert_width: 0.3

  # Head yaw limiting when trunk is pitched down (helps avoid extreme down+yaw fall-overs)
  # onset: trunk_pitch_u threshold where limiting begins (0..1). 0.0 = limit starts as soon as trunk starts pitching.
  head_yaw_limit_pitch_onset: 0.0
  # min_scale: yaw scale at max trunk_pitch_u=1.0. 1.0 disables limiting.
  head_yaw_limit_min_scale: 0.25

  # Forward pitch behavior:
  #  - As you push forward (pitch_u >= 0), the neck extends first.
  #  - Only once the neck is extended do we start pitching the head down.
  #
  # forward_neck_full_at is the fraction of joystick travel at which the neck reaches full extension.
  # Example: 0.65 means: first 65% = extend neck, remaining 35% = start looking down.
  forward_neck_full_at: 0.65
  forward_head_down_gain: 1.0
  forward_head_down_exponent: 1.0

  # Trunk boost (time-based; NOT part of stick range)
  # Engages only after holding stick near full-forward for a moment.
  forward_trunk_enable: true
  forward_trunk_arm_u: 0.98
  forward_trunk_hold_s: 0.25
  forward_trunk_u_max: 1.0
  forward_trunk_down_tau_s: 0.35
  forward_trunk_up_tau_s: 0.40
  # While trunk_boost_u > gate, we freeze head/neck return (trunk comes back first).
  forward_trunk_release_gate_u: 0.25



  # Forward pitch phase-back smoothing (return path)
  # Keeps the forward piecewise mapping active while u decays back to 0,
  # so trunk comes back up first, then head, then neck (instead of snapping at stick release).
  # 0 => snap / disabled.
  forward_u_attack_tau_s: 0.0
  forward_u_release_tau_neck_s: 0.20
  forward_u_release_tau_head_s: 1.40
  forward_u_release_tau_trunk_s: 0.0  # unused (trunk handled by forward_trunk_up_tau_s)


  # Idle wiggle (only when not moving)
  wiggle_freq_hz: 2.0
  wiggle_trunk_amp: 0.2
  wiggle_head_amp: 0.2

  # Trunk-only wiggle state params (state name: trunk_wiggle)
  trunk_wiggle_freq_hz: 3.0
  trunk_wiggle_trunk_amp: 2.0
  trunk_wiggle_head_amp: -0.1

  # Trunk-only wiggle state params (state name: trunk_roll)
  trunk_roll_freq_hz: 1.0
  trunk_roll_trunk_amp: 0.8
  trunk_roll_head_amp: 0.4

  # Trunk-only wiggle state params (state name: nod)
  head_nod_freq_hz: 2.0
  head_nod_amp: 0.15

  # Data-driven one-shot emotes. User clips are read from $HOME/emotes and
  # standard clips are packaged with the runtime. A button whose logical name
  # matches an emote name starts that emote. button_map entries may also use:
  #   short_press: {play_emote: happy_dance_v3}
  emote_interpolate: true
  emote_suppress_walk_in_place_for_feet_planted: true
  emote_trigger_named_buttons: true
  emote_debug: false

  # Virtual button -> state mapping (recommended)
  #
  # This lets you map the SAME physical button to different behaviors based on
  # press duration.
  #
  # Here:
  #   - long press (>1.0s) of "push" => enables the "wiggle" state while held
  #   - short press of "push"       => toggles the "neck_lock" state
  long_press_default_s: 1.0
  button_map:
    push:
      short_press:
        toggle_state: neck_lock
      long_press:
        state: wiggle
        hold_s: 0.5
    reset:
      long_press:
        state: trunk_wiggle
        hold_s: 0.5
    shake:
      short_press:
        toggle_state: trunk_wiggle
      long_press:
        state: trunk_wiggle
        hold_s: 0.5
    wiggle:
      short_press:
        toggle_state: wiggle
        hold_s: 0.5
      long_press:
        state: wiggle
        hold_s: 0.5
    roll:
      short_press:
        toggle_state: trunk_roll
      long_press:
        state: trunk_roll
        hold_s: 0.5
    nod:
      short_press:
        toggle_state: nod
      long_press:
        state: nod
        hold_s: 0.5
    march:
      short_press:
        toggle_state: march
      long_press:
        state: march
        hold_s: 0.5
    center:
      short_press:
        toggle_state: height_center
    jump:
      short_press:
        toggle_state: jump

  # Per-state configuration
  states:
    neck_lock:
      # Only allow enabling neck_lock when neck_pitch is already near the "top".
      # NOTE: if your neck extension sign is negative, use e.g. -0.7.
      min_neck: 0.0

      # In neck_lock mode, pitch input maps to head_pitch so you can look UP/DOWN.
      # head_pitch_invert=true gives the conventional feel: pull back to look up,
      # push forward to look down.
      head_pitch_invert: true
      head_gain: 1.0

      # Allow a small fraction of pitch input to still move the neck (usually 0.0).
      neck_softness: 0.0

    jump:
      # Multiplier on the normal command smoothing alpha for height while jumping.
      # Larger = faster (>= ~10 will often feel like a snap).
      gain: 100.0
      # Auto-clear once |height-1| <= done_eps.
      done_eps: 0.02

    height_center:
      # One-shot: drive height to target (default 0.0) and auto-clear once reached.
      # Multiplier on the normal command smoothing alpha for height while centering.
      # Smaller = slower. 1.0 = normal speed.
      gain: 0.25
      # Target height in unit space.
      target: 0.0
      # Auto-clear once |height-target| <= done_eps.
      done_eps: 0.02

  # Virtual axes
  lb_rb_rate: 0.02
  lb_rb_decay: 0.9
  # 16 reference motions => 15 steps across [-1,1]
  height_step: 0.1333333333

  # Auto-repeat for taller/smaller when held (virtual height)
  height_repeat_delay_s: 0.25
  height_repeat_period_s: 0.08

  # Controller polling
  max_events_per_update: 8
  axis_activity_eps: 0.02
  active_timeout_s: 2.0

  # Scaling on base motion after mapping into policy ranges
  scale_lin_vel_x: 1.0
  scale_lin_vel_y: 1.0
  scale_ang_vel_yaw: 1.0

ducksense:
  # If your IMU quaternion is world->body, set this false.
  imu_quat_body_to_world: true

  # Disturbance mode:
  #  - auto: uses IMU triggers + (if provided) v_loc trigger
  #  - imu:  ignore v_loc even in sim (helps tune IMU-only behavior)
  #  - v_only: only velocity trigger (debug)
  disturbance_mode: auto

  # Treat head/trunk commands as "not idle" so we don't trigger walk-in-place recovery
  # while the user is intentionally moving the head/torso.
  idle_include_head: true
  idle_include_trunk: true
  idle_include_height: false

  # Smooth head/neck tuck used when the sim detects a fall/tip and auto_reset is off.
  safety_tuck:
    enable: false #true
    tau_s: 0      # seconds; 0 => snap
    hold_s: 0.0      # 0 => only while active; >0 => keep active after trigger; <0 => latch until cleared
    zero_base_cmds: true
    zero_trunk_cmds: true
    targets:
      neck_pitch: -1.0
      head_pitch: -1.0
      head_yaw: 0.0
      head_roll: 0.0
  walk_in_place:
    walk_in_place_enable: true

    # How many policy steps to keep "walk in place" on after a disturbance
    walk_in_place_hold_steps: 6

    # Consider the user idle if sum(|selected_cmds|) below this
    walk_in_place_idle_cmd_thresh: 0.05

    # Optional velocity trigger (ignored if you don't provide v_loc or mode=imu)
    walk_in_place_v_enter: 0.32

    # IMU triggers
    walk_in_place_tilt_enter_deg: 16.0
    walk_in_place_pitch_rate_enter: 0.20
    walk_in_place_roll_rate_enter: 0.05

    # Extra heuristics (angles in degrees)
    back_tilt_enter_deg: 16.0
    side_tilt_enter_deg: 3.0

    debug: false
    debug_compare_sources: false
