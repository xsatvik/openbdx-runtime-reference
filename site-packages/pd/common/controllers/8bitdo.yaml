controllers:
  - device: '8BitDo SN30 Pro for Android'
    name: '8BitDo'
    buttons:
      0: 'A'
      1: 'B'
      3: 'X'
      4: 'Y'
      # Bumper buttons
      6: 'LB'
      7: 'RB'
      # Trigger buttons
      8: 'LT'
      9: 'RT'
      # Other buttons
      10: 'Select'
      11: 'Start'
      12: 'Power'
      13: 'LS_B'
      14: 'RS_B'
    axes:
      # Left Stick
      0: ang_vel
      1: lin_vel_x

      # Right Stick
      2: head_yaw
      3: head_pitch

      # Trigger
      4: 'RT'
      5: 'LT'

      # DPad
      6: 'DX'
      7: 'DY'

    # Optional per-controller axis shaping/filtering.
    # 8BitDo currently maps only base-motion + height axes in this file, so
    # these are intentionally mild to keep driving responsive.
