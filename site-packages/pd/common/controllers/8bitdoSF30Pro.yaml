controllers:
  - device: '8Bitdo SF30 Pro'
    name: '8BitDo'
    buttons:
      0: 'B'
      1: 'A'
      2: 'Y'
      3: 'X'
      # Bumper buttons
      4: 'LB'
      5: 'RB'
      # Trigger buttons
      # Not present
      # Other buttons
      6: 'Select'
      7: 'start'
 #     8: 'LS_B'
      8: 'push'
      9: 'RS_B'
    axes:
      # Right Stick
      0: -head_yaw
      1: head_pitch
      # Trigger
      2: 'LT'
      # Left Stick
      3: ang_vel
      4: lin_vel_x
      # Trigger
      5: 'RT'
      # DPad
      6: 'DX'
      7: 'DY'

    # Optional per-controller axis shaping/filtering.
    # 8BitDo currently maps only base-motion + height axes in this file, so
    # these are intentionally mild to keep driving responsive.
