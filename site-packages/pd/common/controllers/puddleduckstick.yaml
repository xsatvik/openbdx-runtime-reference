controllers:
  - device: "PuddleDuckStick"
    name: "PuddleDuckStick"

    # PuddleDuckStick is a virtual Linux controller. Its YAML keys are virtual
    # joystick axis numbers, not raw SBUS channel numbers. broadcast_state maps
    # raw SBUS 0,1,4,2,3,5,6,7 to virtual axes 0..7 respectively.
    #
    # The normal Linux js* compatibility path inverts physical joystick axes.
    # Disable that implicit inversion here so js*, evdev, FIFO, and shadow
    # readers all apply only the signs written below.
    invert_js_axes: false

    buttons:
      0: 'A'
      1: 'push'
      2: 'reset'
      3: 'height_mode'
      4: 'X'
      5: 'Y'
      6: 'LB'
      7: 'kyberalt'

    axes:
      # Virtual 0/1 <- raw SBUS 0/1: left stick
      0: -lin_vel_x
      1: ang_vel

      # Virtual 2 <- raw SBUS 4: left pot
      2: lin_vel_y

      # Virtual 3/4 <- raw SBUS 2/3: right stick
      3: -head_pitch
      4: -head_yaw

      # Virtual 5 <- raw SBUS 5: right pot
      5: -head_roll

      # Virtual 6 <- raw SBUS 6: KyberPad source. The PuddleDuck Teensy already
      # decodes this ladder and forwards BTN1001+ key events; keep the raw axis
      # state but do not decode it a second time in PuddleJoy.
      6: kyberpad

      # Virtual 7 <- raw SBUS 7: left slider
      # 7: height

    kyberpad:
      # PuddleDuckStick is the virtual controller used by RLWalk on the robot.
      # The firmware already emits decoded BTN1001+ events, so this mapping owns
      # event names/colors/export metadata without synthesizing duplicate presses.
      decode_axis: false
      button_base: 1000

      general:
        # Default appearance inherited by buttons without overrides.
        background: "#A5A2A5"
        text_color: "#000000"
        pressed_color: "#FFFFFF"

      # KyberPad application buttons. The one-key mapping key is the display
      # label. ``event`` is optional and defaults to the lowercase label.
      buttons:
        # Button 01
        - NEUTRAL:
            background: "#C60000"
            text_color: "#000000"

        # Button 02
        - SHAKE:

        # Button 03
        - WIGGLE:

        # Button 04
        - ROLL:

        # Button 05
        - NOD:

        # Button 06
        - MARCH:

        # Button 07
        - EXCITED:
            event: /antenna/excited

        # Button 08
        - HAPPY:
            event: /antenna/happy

        # Button 09
        - SCARED:
            event: /antenna/scared

        # Button 10
        - SCAN:
            event: /antenna/scan

        # Button 11
        - JUMP:

        # Button 12
        - FASTER:

        # Button 13
        - SLOWER:

        # Button 14
        - TALLER:

        # Button 15
        - SMALLER:

        # Button 16
        - START:

        # Button 17
        - "":

        # Button 18
        - "":

        # Button 19
        - "":

        # Button 20
        - "":

        # Button 21
        - "":

        # Button 22
        - "":

        # Button 23
        - "":

        # Button 24
        - "":

        # Button 25
        - "":

        # Button 26
        - "":

        # Button 27
        - POSE:

        # Button 28
        - STAND:

        # Button 29
        - RELAX:
            background: "#0041C6"
            text_color: "#000000"

        # Button 30
        - STOP:
            background: "#C60000"
            text_color: "#000000"

        # Button 31
        - "":

        # Button 32
        - "":

        # Button 33
        - "":

        # Button 34
        - "":

        # Button 35
        - "":

        # Button 36
        - "":

        # Button 37
        - "":

        # Button 38
        - "":

        # Button 39
        - "":

        # Button 40
        - "":

        # Button 41
        - "":

        # Button 42
        - "":

        # Button 43
        - "":

        # Button 44
        - "":

        # Button 45
        - "":

      pwm:
        values:
          - 288
          - 376
          - 478
          - 580
          - 682
          - 784
          - 834
          - 886
          - 1090
          - 1192
          - 1294
          - 1396
          - 1498
          - 1600
          - 1702
        released: 172
