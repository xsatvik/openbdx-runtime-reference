controllers:
  - device: "ROS Joy"
    name: "Steam Deck (ROS)"
    ros_topic: "/joy"

    # Button indices from your /joy mapping
    buttons:
      0: 'B'
      1: 'A'
      2: 'Y'
      3: 'X'

      # D-Pad (use short names U/D/L/R so they’re gesture-friendly)
      11: 'U'
      12: 'D'
      13: 'L'
      14: 'R'

      # Other buttons
      4: 'Select'
      5: 'Power'  
      6: 'Start'
      7: 'LS_B'
      8: 'RS_B'
      9: 'LB'        # Left bumper
      10: 'RB'       # Right bumper
      15: 'Ellipsis'
      16: 'RT'
      17: 'LT'
      18: 'R5'
      19: 'L5'

    # Axes from your /joy mapping → semantic names used by your code
    axes:
      # Left Stick
      0: head_yaw       # Left stick left/right
      #0: [lin_vel_y, trunk_roll]
      1: -head_pitch       # Left stick up/down (invert so up = +)

      # Right Stick
      2: -ang_vel         # Right stick left/right
      3: -lin_vel_x        # Right stick up/down

      # Trigger
      4: LT               # Left trigger axis
      5: RT               # Right trigger axis

      # D-Pad axes (common ROS Joy layout)
      6: DX
      7: DY

    # Optional gesture hook (uncomment + define sequences if you want)
    # gesture_trigger: L1
    # gestures:
    #   Konami: [U, U, D, D, L, R, L, R, B, A]
    # Optional per-controller axis shaping/filtering.
    # 8BitDo currently maps only base-motion + height axes in this file, so
    # these are intentionally mild to keep driving responsive.
    axis_curves:
      # lin_vel_x:
      #   deadzone: 0.04
      #   exponent: 1.10
      #   tau_s: 0.04
      # lin_vel_y:
      #   deadzone: 0.04
      #   exponent: 1.10
      #   tau_s: 0.04
      # ang_vel:
      #   deadzone: 0.04
      #   exponent: 1.15
      #   tau_s: 0.05
      # head_pitch:
      #   deadzone: 0.02
      #   exponent: 1.15
      #   tau_s: 1.0
      #   init_to_target: false
      head_yaw:
        deadzone: 0.02
        exponent: 1.20
        tau_s: 0.82
        init_to_target: false
