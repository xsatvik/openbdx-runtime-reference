controllers:
  - device: 'FrSky FrSky Simulator'
    name: 'FrSky FrSky Simulator'
    buttons:
      0: 'A'
      1: 'push'
      2: 'posture'
      3: 'height_mode'
      4: 'X'
      5: 'Y'
      6: 'LB'
      7: 'kyberalt'

    axes:
      # Left Stick
      0: -lin_vel_x
      1: ang_vel
      # Right Stick
      2: -head_pitch
      3: -head_yaw
      # Left Pot
      4: [lin_vel_y, trunk_roll]
      # Right Pot
      5: -head_roll
      # KyberPad source
      6: kyberpad
      # Slider Left
      #7: height

    # KyberPad (SBUS ladder) decoding configuration.
    # These values are known to differ between USB HID vs radio link,
    # and can also be changed in the KyberPad app.
    kyberpad:
      # The 15 ladder "button" centers, in order.
      sequence:
        - -31755
        - -27363
        - -21958
        - -16553
        - -11148
        - -5743
        - -3041
        - -338
        - 0
        - 5404
        - 10810
        - 16215
        - 21620
        - 27025
        - 32430

      match_tolerance: 250

      idle_value: -32767
      idle_tolerance: 150

      # Optional overrides (these match current defaults):
      # shift_button: kyberalt
      # button_base: 1000

      general:
        # Default appearance inherited by buttons without overrides.
        background: "#A5A2A5"
        text_color: "#000000"
        pressed_color: "#FFFFFF"

      # KyberPad application buttons. The one-key mapping key is the display
      # label. ``event`` is optional and defaults to the lowercase label.
      buttons:
        # Button 01
        - NEUTRAL:
            background: "#C60000"
            text_color: "#000000"

        # Button 02
        - SHAKE:

        # Button 03
        - WIGGLE:

        # Button 04
        - ROLL:

        # Button 05
        - NOD:

        # Button 06
        - MARCH:

        # Button 07
        - EXCITED:
            event: /antenna/excited

        # Button 08
        - HAPPY:
            event: /antenna/happy

        # Button 09
        - SCARED:
            event: /antenna/scared

        # Button 10
        - SCAN:
            event: /antenna/scan

        # Button 11
        - JUMP:

        # Button 12
        - FASTER:

        # Button 13
        - SLOWER:

        # Button 14
        - TALLER:

        # Button 15
        - SMALLER:

        # Button 16
        - START:

        # Button 17
        - "":

        # Button 18
        - "":

        # Button 19
        - "":

        # Button 20
        - "":

        # Button 21
        - "":

        # Button 22
        - "":

        # Button 23
        - "":

        # Button 24
        - "":

        # Button 25
        - "":

        # Button 26
        - "":

        # Button 27
        - POSE:

        # Button 28
        - STAND:

        # Button 29
        - RELAX:
            background: "#0041C6"
            text_color: "#000000"

        # Button 30
        - STOP:
            background: "#C60000"
            text_color: "#000000"

        # Button 31
        - "":

        # Button 32
        - "":

        # Button 33
        - "":

        # Button 34
        - "":

        # Button 35
        - "":

        # Button 36
        - "":

        # Button 37
        - "":

        # Button 38
        - "":

        # Button 39
        - "":

        # Button 40
        - "":

        # Button 41
        - "":

        # Button 42
        - "":

        # Button 43
        - "":

        # Button 44
        - "":

        # Button 45
        - "":

      pwm:
        values:
          - 288
          - 376
          - 478
          - 580
          - 682
          - 784
          - 834
          - 886
          - 1090
          - 1192
          - 1294
          - 1396
