controllers:
- device: SteamDuckStick
  name: SteamDuckStick
  buttons:
    0: A
    1: push
    2: reset
    3: height_mode
    4: X
    5: Y
    6: LB
    15: kyberalt
    1001: neutral
    1002: shake
    1003: wiggle
    1004: roll
    1005: nod
    1006: march
    1010: center
    1011: jump
    1012: faster
    1013: slower
    1014: taller
    1015: smaller
    1027: pose
    1028: stand
    1029: relax
    1030: start
    # broadcast_state will handle
    #501: /audio/mute
  axes:
    0: -lin_vel_x
    1: ang_vel
    2: -head_pitch
    3: head_yaw
    # broadcast_state will handle
    #500: /audio/volume
